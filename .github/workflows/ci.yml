# CI：lint + 测试。所有步骤的 working-directory 均为仓库根目录
#（即 checkout 后的 $GITHUB_WORKSPACE，pyproject.toml 所在处）。
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .   # 仓库根目录
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev deps
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check ant
      - name: Pytest
        run: pytest -q

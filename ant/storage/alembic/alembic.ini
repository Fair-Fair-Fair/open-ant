# Alembic configuration for open-ant storage migrations.
#
# CREDENTIALS DISCIPLINE: `sqlalchemy.url` is intentionally left empty here.
# It is injected at runtime from .env by `ant.storage.db.run_migrations()`
# (see `alembic_config_for`).  Never commit a real DSN with a password.

[alembic]
script_location = %(here)s
# sqlalchemy.url is set programmatically — see ant/storage/db.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
